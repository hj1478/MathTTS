<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>문제 읽는 중</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@400;600&amp;family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap">
<style>
body{margin:0}
.mt{--bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#EDF0F4;--border:#D3D8E0;--border-strong:#7D8796;--text:#12161C;--text-2:#475061;--primary:#1D4ED8;--on-primary:#FFFFFF;--primary-text:#1D4ED8;--primary-soft:#E6ECFC;--on-primary-soft:#1E3A8A;--hl-bg:#FFE58A;--hl-text:#12161C;--hl-line:#8A5A00;--note-bg:#FFF6E0;--note-text:#6B4500;--note-border:#E6C377;--error-bg:#FDECEC;--error-text:#9F1D1D;--error-border:#E8A3A3;--info-bg:#E8EEFB;--info-text:#1E3A8A;--info-border:#AFC2F0;--success:#15803D;--focus:#1D4ED8;--paper:#ECE9E1;--ink:#26282B;font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.mt.dark{--bg:#0E1116;--surface:#171B22;--surface-2:#222833;--border:#323A48;--border-strong:#7A8496;--text:#EDF0F4;--text-2:#B3BBC7;--primary:#8EB1FF;--on-primary:#0B1530;--primary-text:#9DBBFF;--primary-soft:#1C2A4A;--on-primary-soft:#C9D8FF;--hl-bg:#5C4A0E;--hl-text:#FFF4CC;--hl-line:#F2C94C;--note-bg:#2A2210;--note-text:#F3D38B;--note-border:#5A4719;--error-bg:#3A1717;--error-text:#FFB3B3;--error-border:#7A3030;--info-bg:#172443;--info-text:#C3D3FF;--info-border:#34487A;--success:#6FD69A;--focus:#9DBBFF}
.mt button{font:inherit;color:inherit;cursor:pointer;margin:0}
.mt a{color:var(--primary-text)}
.mt a:hover{color:var(--on-primary-soft)}
.mt :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; min-height: 64px; padding: 8px 20px; box-sizing: border-box; background: var(--surface); border-bottom: 1px solid var(--border)">
    <span style="font-size: 19px; line-height: 26px; font-weight: 700">문제 읽는 중</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 20px 24px">
    <div aria-live="polite" style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--text-2)">4단계 중 2단계</p>
      <h1 style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">문제를 읽고 있어요</h1>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-2)"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="font-size: 17px; line-height: 24px; color: var(--text-2)">경과 시간</span>
      <span style="margin-left: auto; font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums">{{elapsed}}</span>
    </div>

    <div role="status" style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: var(--info-bg); border: 1px solid var(--info-border); color: var(--info-text)">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <strong style="font-size: 17px; line-height: 24px; font-weight: 700">서버를 준비하고 있어요</strong>
        <span style="font-size: 16px; line-height: 24px">처음에는 몇 분 걸릴 수 있어요. 멈춘 것이 아니에요. 단계가 끝나면 자동으로 넘어가요.</span>
      </div>
    </div>

    <ol aria-label="진행 단계" style="list-style: none; margin: 0; padding: 20px 20px 4px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column">
      <li style="display: flex; gap: 14px; min-height: 60px">
        <div aria-hidden="true" style="flex: none; width: 32px; display: flex; flex-direction: column; align-items: center">
          <span style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="flex: 1; width: 2px; margin: 4px 0; background: var(--primary)"></span>
        </div>
        <div style="flex: 1; display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 16px">
          <span style="font-size: 17px; line-height: 26px; font-weight: 500">업로드</span>
          <span style="font-size: 15px; line-height: 26px; color: var(--text-2)">완료</span>
        </div>
      </li>
      <li aria-current="step" style="display: flex; gap: 14px; min-height: 60px">
        <div aria-hidden="true" style="flex: none; width: 32px; display: flex; flex-direction: column; align-items: center">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--primary); display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 50%; background: var(--primary)"></span></span>
          <span style="flex: 1; width: 2px; margin: 4px 0; background: var(--border)"></span>
        </div>
        <div style="flex: 1; display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 16px">
          <span style="font-size: 17px; line-height: 26px; font-weight: 700">문제 읽기</span>
          <span style="font-size: 15px; line-height: 26px; font-weight: 700; color: var(--primary-text)">진행 중</span>
        </div>
      </li>
      <li style="display: flex; gap: 14px; min-height: 60px">
        <div aria-hidden="true" style="flex: none; width: 32px; display: flex; flex-direction: column; align-items: center">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--border-strong); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">3</span>
          <span style="flex: 1; width: 2px; margin: 4px 0; background: var(--border)"></span>
        </div>
        <div style="flex: 1; display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 16px">
          <span style="font-size: 17px; line-height: 26px; color: var(--text-2)">수식 해석</span>
          <span style="font-size: 15px; line-height: 26px; color: var(--text-2)">대기</span>
        </div>
      </li>
      <li style="display: flex; gap: 14px; min-height: 52px">
        <div aria-hidden="true" style="flex: none; width: 32px; display: flex; flex-direction: column; align-items: center">
          <span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--border-strong); color: var(--text-2); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">4</span>
        </div>
        <div style="flex: 1; display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 16px">
          <span style="font-size: 17px; line-height: 26px; color: var(--text-2)">음성 만들기</span>
          <span style="font-size: 15px; line-height: 26px; color: var(--text-2)">대기</span>
        </div>
      </li>
    </ol>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-2); text-align: center">10분이 지나도 끝나지 않으면 알려 드릴게요.</p>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 17px; line-height: 24px; font-weight: 600; text-decoration: none; box-sizing: border-box">취소</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sec: 102 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = (this.state && this.state.sec) || 102;
      this.setState({ sec: s + 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const s = (this.state && this.state.sec) || 102;
    const m = Math.floor(s / 60);
    const r = s % 60;
    return {
      theme: this.props.dark ? 'mt dark' : 'mt',
      elapsed: m + '분 ' + String(r).padStart(2, '0') + '초'
    };
  }
}
</script>
</body>
</html>
