<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인식된 문제 없음</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.mt{--bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#EDF0F4;--border:#D3D8E0;--border-strong:#7D8796;--text:#12161C;--text-2:#475061;--primary:#1D4ED8;--on-primary:#FFFFFF;--primary-text:#1D4ED8;--primary-soft:#E6ECFC;--on-primary-soft:#1E3A8A;--hl-bg:#FFE58A;--hl-text:#12161C;--hl-line:#8A5A00;--note-bg:#FFF6E0;--note-text:#6B4500;--note-border:#E6C377;--error-bg:#FDECEC;--error-text:#9F1D1D;--error-border:#E8A3A3;--info-bg:#E8EEFB;--info-text:#1E3A8A;--info-border:#AFC2F0;--success:#15803D;--focus:#1D4ED8;--paper:#ECE9E1;--ink:#26282B;font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.mt.dark{--bg:#0E1116;--surface:#171B22;--surface-2:#222833;--border:#323A48;--border-strong:#7A8496;--text:#EDF0F4;--text-2:#B3BBC7;--primary:#8EB1FF;--on-primary:#0B1530;--primary-text:#9DBBFF;--primary-soft:#1C2A4A;--on-primary-soft:#C9D8FF;--hl-bg:#5C4A0E;--hl-text:#FFF4CC;--hl-line:#F2C94C;--note-bg:#2A2210;--note-text:#F3D38B;--note-border:#5A4719;--error-bg:#3A1717;--error-text:#FFB3B3;--error-border:#7A3030;--info-bg:#172443;--info-text:#C3D3FF;--info-border:#34487A;--success:#6FD69A;--focus:#9DBBFF}
.mt button{font:inherit;color:inherit;cursor:pointer;margin:0}
.mt a{color:var(--primary-text)}
.mt :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 4px; min-height: 64px; padding: 8px 8px; box-sizing: border-box; background: var(--surface); border-bottom: 1px solid var(--border)">
    <a href="Main.dc.html" aria-label="처음 화면으로" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; color: var(--text)">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 19px; line-height: 26px; font-weight: 700">읽은 결과</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 20px 24px">
    <figure style="margin: 0; display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border)">
      <span role="img" aria-label="올린 사진: 흐릿하고 어두운 종이" style="flex: none; width: 88px; height: 88px; border-radius: 8px; background: #6E6A62; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 14px; box-sizing: border-box">
        <span style="display: block; height: 5px; width: 90%; border-radius: 3px; background: #858077"></span>
        <span style="display: block; height: 5px; width: 70%; border-radius: 3px; background: #858077"></span>
        <span style="display: block; height: 5px; width: 80%; border-radius: 3px; background: #858077"></span>
      </span>
      <figcaption style="font-size: 15px; line-height: 22px; color: var(--text-2)">올린 사진</figcaption>
    </figure>

    <div role="alert" style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em">사진에서 문제를<br>찾지 못했어요</h1>
      <p style="margin: 0; font-size: 17px; line-height: 26px; color: var(--text-2)">글자를 알아볼 수 없었어요. 아래 방법으로 다시 찍어 보세요.</p>
    </div>

    <section aria-labelledby="tips-h" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border)">
      <h2 id="tips-h" style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 700">이렇게 해 보세요</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
        <li style="display: flex; gap: 12px; align-items: flex-start; font-size: 17px; line-height: 26px">
          <span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--on-primary-soft); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">1</span>
          <span>문제 글자가 화면을 가득 채우도록 가까이 찍어 주세요</span>
        </li>
        <li style="display: flex; gap: 12px; align-items: flex-start; font-size: 17px; line-height: 26px">
          <span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--on-primary-soft); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">2</span>
          <span>밝은 곳에서 빛 반사와 그림자를 피해 주세요</span>
        </li>
        <li style="display: flex; gap: 12px; align-items: flex-start; font-size: 17px; line-height: 26px">
          <span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--on-primary-soft); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">3</span>
          <span>휴대폰을 종이와 평행하게 들어 주세요</span>
        </li>
      </ul>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
      <a href="Crop.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 56px; padding: 0 20px; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-size: 17px; line-height: 24px; font-weight: 700; text-decoration: none">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        다시 찍기
      </a>
      <a href="Crop.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 17px; line-height: 24px; font-weight: 600; text-decoration: none; box-sizing: border-box">갤러리에서 선택</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'mt dark' : 'mt' };
  }
}
</script>
</body>
</html>
