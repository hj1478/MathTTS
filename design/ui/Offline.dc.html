<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오프라인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.mt{--bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#EDF0F4;--border:#D3D8E0;--border-strong:#7D8796;--text:#12161C;--text-2:#475061;--primary:#1D4ED8;--on-primary:#FFFFFF;--primary-text:#1D4ED8;--primary-soft:#E6ECFC;--on-primary-soft:#1E3A8A;--hl-bg:#FFE58A;--hl-text:#12161C;--hl-line:#8A5A00;--note-bg:#FFF6E0;--note-text:#6B4500;--note-border:#E6C377;--error-bg:#FDECEC;--error-text:#9F1D1D;--error-border:#E8A3A3;--info-bg:#E8EEFB;--info-text:#1E3A8A;--info-border:#AFC2F0;--success:#15803D;--focus:#1D4ED8;--paper:#ECE9E1;--ink:#26282B;font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.mt.dark{--bg:#0E1116;--surface:#171B22;--surface-2:#222833;--border:#323A48;--border-strong:#7A8496;--text:#EDF0F4;--text-2:#B3BBC7;--primary:#8EB1FF;--on-primary:#0B1530;--primary-text:#9DBBFF;--primary-soft:#1C2A4A;--on-primary-soft:#C9D8FF;--hl-bg:#5C4A0E;--hl-text:#FFF4CC;--hl-line:#F2C94C;--note-bg:#2A2210;--note-text:#F3D38B;--note-border:#5A4719;--error-bg:#3A1717;--error-text:#FFB3B3;--error-border:#7A3030;--info-bg:#172443;--info-text:#C3D3FF;--info-border:#34487A;--success:#6FD69A;--focus:#9DBBFF}
.mt button{font:inherit;color:inherit;cursor:pointer;margin:0}
.mt a{color:var(--primary-text)}
.mt :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 64px; padding: 8px 8px 8px 20px; box-sizing: border-box; background: var(--surface); border-bottom: 1px solid var(--border)">
    <span style="font-size: 19px; line-height: 26px; font-weight: 700; letter-spacing: -0.01em">MathTTS</span>
    <a href="History.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--text); font-size: 17px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      기록
    </a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 20px 20px 24px">
    <div role="alert" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 14px; background: var(--surface-2); border: 2px solid var(--border-strong); color: var(--text)">
      <div style="display: flex; gap: 12px; align-items: flex-start">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 4.2-2.4M19 12.5a10 10 0 0 0-2.3-1.6M2 8.8a15 15 0 0 1 4.3-2.6M22 8.8A15 15 0 0 0 11 5"></path><path d="M12 20h.01"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <strong style="font-size: 17px; line-height: 24px; font-weight: 700">인터넷에 연결되어 있지 않아요</strong>
          <span style="font-size: 16px; line-height: 24px; color: var(--text-2)">연결되면 문제를 읽을 수 있어요. 저장한 기록은 지금도 볼 수 있어요.</span>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="flex: 1 1 130px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--border-strong); background: var(--surface); font-size: 16px; font-weight: 600">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
          연결 다시 확인
        </button>
        <a href="History.dc.html" style="flex: 1 1 130px; display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 14px; border-radius: 12px; font-size: 16px; font-weight: 600">기록 보기</a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 28px; line-height: 38px; font-weight: 700; letter-spacing: -0.02em">수학 문제를<br>소리로 들어 보세요</h1>
      <p style="margin: 0; font-size: 17px; line-height: 26px; color: var(--text-2)">문제 사진을 올리면 수식까지 한국어로 읽어 드려요.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <a href="Crop.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 64px; padding: 0 20px; border-radius: 16px; background: var(--primary); color: var(--on-primary); font-size: 19px; line-height: 26px; font-weight: 700; text-decoration: none">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        사진 찍기
      </a>
      <a href="Crop.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 17px; line-height: 24px; font-weight: 600; text-decoration: none; box-sizing: border-box">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
        갤러리에서 선택
      </a>
      <p style="margin: 0; text-align: center; font-size: 15px; line-height: 22px; color: var(--text-2)">사진은 미리 찍어 둘 수 있어요. 연결되면 읽기 시작해요.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'mt dark' : 'mt' };
  }
}
</script>
</body>
</html>
